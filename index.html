<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قمر رهف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marhey:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* ليل حالك */
            font-family: 'Marhey', cursive;
            touch-action: none;
        }

        /* 1. الخلفية (السماء والقمر) */
        #night-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* قمر واقعي باستخدام CSS */
        .moon {
            width: 180px;
            height: 180px;
            background-color: #e2e8f0;
            border-radius: 50%;
            box-shadow: 
                0 0 20px #f8fafc, 
                0 0 60px rgba(255, 255, 255, 0.3),
                inset -20px -20px 50px rgba(0,0,0,0.1); /* ظلال داخلية للعمق */
            position: relative;
            margin-bottom: 2rem;
            animation: moonFloat 6s ease-in-out infinite;
        }

        /* فوهات القمر (Textures) */
        .moon::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-image: 
                radial-gradient(circle at 30% 40%, rgba(200,200,200,0.4) 0%, transparent 10%),
                radial-gradient(circle at 70% 60%, rgba(180,180,180,0.4) 0%, transparent 15%),
                radial-gradient(circle at 40% 70%, rgba(190,190,190,0.3) 0%, transparent 8%);
            opacity: 0.6;
        }

        @keyframes moonFloat {
            0%, 100% { transform: translateY(0); box-shadow: 0 0 20px #f8fafc, 0 0 60px rgba(255, 255, 255, 0.3); }
            50% { transform: translateY(-10px); box-shadow: 0 0 30px #f8fafc, 0 0 80px rgba(255, 255, 255, 0.4); }
        }

        .message-container {
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            transform: scale(0.9);
            opacity: 0; 
            transition: all 1.5s ease;
        }

        .message-container.visible {
            opacity: 1;
            transform: scale(1);
        }

        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #f1f5f9; }
        p { font-size: 1.2rem; color: #cbd5e1; }

        /* 2. طبقة الضباب (Canvas 1) */
        #fog-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: grab;
        }

        /* 3. طبقة المطر (Canvas 2 - فوق الضباب) */
        #rain-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: none; /* يسمح باللمس من خلاله للطبقة السفلية */
        }

        /* 4. إطار النافذة */
        .window-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9); /* ظل داخلي قوي */
            border: 20px solid #2d2a26; /* إطار خشبي غامق */
        }

        /* تعليمات */
        .hint {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            pointer-events: none;
            animation: pulse 2s infinite;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    </style>
</head>
<body>

    <!-- الخلفية والقمر -->
    <div id="night-bg">
        <div class="moon"></div>
        <div class="message-container" id="finalMessage">
            <h1>هذه أنتِ يا رهف 🌕</h1>
            <p>ارجعي أقوى.. الدنيا ضلمة بدونك</p>
        </div>
    </div>

    <!-- طبقات الرسم -->
    <canvas id="fog-canvas"></canvas>
    <canvas id="rain-canvas"></canvas>
    
    <!-- الإطار -->
    <div class="window-frame"></div>

    <div class="hint" id="hintText">امسحي الضباب لترَيْ الحقيقة 👆</div>

    <script>
        const fogCanvas = document.getElementById('fog-canvas');
        const fogCtx = fogCanvas.getContext('2d');
        
        const rainCanvas = document.getElementById('rain-canvas');
        const rainCtx = rainCanvas.getContext('2d');

        const finalMessage = document.getElementById('finalMessage');
        const hintText = document.getElementById('hintText');

        let width, height;
        let rainDrops = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            fogCanvas.width = width;
            fogCanvas.height = height;
            
            rainCanvas.width = width;
            rainCanvas.height = height;
            
            resetFog();
        }

        // رسم الضباب الليلي
        function resetFog() {
            fogCtx.fillStyle = "rgba(15, 23, 42, 0.95)"; // لون كحلي غامق (ضباب ليلي)
            fogCtx.fillRect(0, 0, width, height);
            
            // كتابة مقلوبة على الضباب (اسمها)
            fogCtx.save();
            fogCtx.scale(-1, 1);
            fogCtx.font = "bold 60px Arial";
            fogCtx.fillStyle = "rgba(255,255,255,0.05)";
            fogCtx.textAlign = "center";
            fogCtx.fillText("? fhaR", -width/2, height/2 + 200);
            fogCtx.restore();
        }

        // نظام المطر
        class Drop {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.speed = Math.random() * 15 + 10;
                this.len = Math.random() * 20 + 10;
            }
            fall() {
                this.y += this.speed;
                if (this.y > height) {
                    this.y = -this.len;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                rainCtx.beginPath();
                rainCtx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                rainCtx.lineWidth = 1;
                rainCtx.moveTo(this.x, this.y);
                rainCtx.lineTo(this.x, this.y + this.len);
                rainCtx.stroke();
            }
        }

        // إنشاء قطرات المطر
        for(let i=0; i<150; i++) rainDrops.push(new Drop());

        function animateRain() {
            rainCtx.clearRect(0, 0, width, height);
            rainDrops.forEach(drop => {
                drop.fall();
                drop.draw();
            });
            requestAnimationFrame(animateRain);
        }

        // منطق المسح
        let isDrawing = false;
        let revealedPercent = 0;
        let isFullyRevealed = false;

        function getPos(e) {
            const rect = fogCanvas.getBoundingClientRect();
            if (e.touches) {
                return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function wipe(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            
            // المسح بفرشاة ناعمة
            fogCtx.globalCompositeOperation = 'destination-out';
            
            // التدرج لعمل حواف ناعمة للمسح
            const gradient = fogCtx.createRadialGradient(pos.x, pos.y, 10, pos.x, pos.y, 50);
            gradient.addColorStop(0, 'rgba(0,0,0,1)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            
            fogCtx.fillStyle = gradient;
            fogCtx.beginPath();
            fogCtx.arc(pos.x, pos.y, 50, 0, Math.PI * 2);
            fogCtx.fill();
            
            fogCtx.globalCompositeOperation = 'source-over';

            checkCompletion();
        }

        // التحقق من نسبة المسح (بشكل خفيف)
        let checkTimeout;
        function checkCompletion() {
            if (isFullyRevealed || checkTimeout) return;

            checkTimeout = setTimeout(() => {
                const imageData = fogCtx.getImageData(0, 0, width, height);
                const data = imageData.data;
                let transparentPixels = 0;
                
                // فحص كل 200 بيكسل للأداء
                for (let i = 3; i < data.length; i += 800) {
                    if (data[i] < 50) transparentPixels++; // إذا الشفافية عالية
                }
                
                // إذا مسحنا أكثر من 30%
                if (transparentPixels > (data.length / 800) * 0.3) {
                    revealMessage();
                }
                checkTimeout = null;
            }, 200);
        }

        function revealMessage() {
            isFullyRevealed = true;
            hintText.style.opacity = 0;
            finalMessage.classList.add('visible');
            
            // تلاشي الضباب المتبقي ببطء لجمالية المنظر
            fogCanvas.style.transition = 'opacity 3s ease';
            fogCanvas.style.opacity = '0.3'; // نترك قليلاً من الضباب للواقعية
        }

        // الأحداث
        window.addEventListener('resize', resize);
        
        fogCanvas.addEventListener('mousedown', wipe);
        window.addEventListener('mousemove', (e) => { if(isDrawing) wipe(e); });
        window.addEventListener('mouseup', () => isDrawing = false);

        fogCanvas.addEventListener('touchstart', wipe, {passive: false});
        fogCanvas.addEventListener('touchmove', (e) => { wipe(e); }, {passive: false});
        window.addEventListener('touchend', () => isDrawing = false);

        // البدء
        resize();
        animateRain();

    </script>
</body>
</html>
